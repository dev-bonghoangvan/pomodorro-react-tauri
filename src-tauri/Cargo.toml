[package]
name = "pomodoro-tauri-pixi"
version = "0.1.0"
description = "Pomodoro app (Tauri + Pixi)"
authors = ["You"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["window-all"] }
cfg-if = "1"

# Windows registry for autostart
winreg = { version = "0.52", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
